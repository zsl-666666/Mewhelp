[project]
name = "chapter-01-customer-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
